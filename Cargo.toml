[workspace]
members = [
    "src",
    "src-tauri"
]
resolver = "3"

# Optimize dependencies in dev builds for better runtime performance.
# Our own crates stay at opt-level 0 for fast recompilation.
[profile.dev.package."*"]
opt-level = 2

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# HTTP server (API Gateway + Management API)
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }

# HTTP client (forward to upstream providers)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Byte buffers
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Encryption
aes-gcm = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Home directory detection (tool config paths)
dirs = "6"

# Archive (diagnostic package)
zip = "2"

# Concurrent map for rate limiting
dashmap = "6"

# Order-preserving TOML editing (Codex/Grok config.toml upsert)
toml_edit = "0.22"

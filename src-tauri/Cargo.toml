[package]
name = "llm-api-proxy-app"
version = "0.4.1"
edition = "2021"
rust-version = "1.77.2"
description = "Multi-provider LLM API proxy gateway with native GUI"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core library (backend logic)
llm-api-proxy = { path = "../src" }

# Tauri shell
tauri = { version = "2.11", features = ["tray-icon"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
arboard = "3"
tauri-plugin-single-instance = "2.4.3"
rfd = "0.15"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
